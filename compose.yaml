services:
  vulnerable:
    image: php:8.4.26-apache
    ports:
      - "127.0.0.1:18080:80"
    volumes:
      - ./website:/var/www/html:ro
    tmpfs:
      - /tmp
    pids_limit: 128
    mem_limit: 512m
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    networks:
      - lab

  fixed:
    image: php:8.4.27-apache
    ports:
      - "127.0.0.1:18081:80"
    volumes:
      - ./website:/var/www/html:ro
    tmpfs:
      - /tmp
    pids_limit: 128
    mem_limit: 512m
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    networks:
      - lab

networks:
  lab: {}
